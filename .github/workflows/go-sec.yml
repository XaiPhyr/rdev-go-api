name: Go Security Scan Pipeline
on:
  push:
    branches: ["main"]

jobs:
  tests:
    name: Run Gosec
    runs-on: ubuntu-latest

    env:
      GO111MODULE: on

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...
